<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Scavenger's Codex</title>
<meta name="description" content="A D&D 5e harvesting and crafting handbook: skin, harvest and forage components, then craft magic items.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23245F54'/%3E%3Cpath d='M9 23 L16 7 L23 23 M12 17 H20' stroke='%23F2E2B8' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<!--APP-->
<div id="app">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="The Scavenger's Codex — home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Scavenger's Codex</span>
    </a>
    <div class="search-wrap">
      <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Search creatures, parts, items, places…" autocomplete="off" spellcheck="false" aria-label="Search the codex">
      <kbd class="kbd-hint">/</kbd>
      <div id="suggest" class="suggest" role="listbox" hidden></div>
    </div>
    <button id="modeBtn" class="mode-btn" type="button" aria-pressed="false">DM view</button>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </header>
  <nav class="sidenav" id="nav" aria-label="Sections"></nav>
  <main id="view" tabindex="-1"><div class="loading">Opening the codex…</div></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<!--/APP-->
<script src="rules.js"></script>
<script src="plates.js"></script>
<script src="qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
